# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Maven Build

permissions:
  contents: read

on:
  push:
    branches: [ 'dev-1.x' ]
  pull_request:
    branches: [ 'dev-1.x' , 'release-1.x' ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '11' , '17' , '21' , '25' ]
        maven-profile-spring-cloud: [ 'spring-cloud-hoxton' , 'spring-cloud-2020' , 'spring-cloud-2021' ]
    steps:
      - name: Docker Setup Compose
        uses: docker/setup-compose-action@v2.3.0
        with:
          version: latest

      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run Docker Compose
        run: docker compose -f "docker/test-services.yml" up -d

      - name: Build with Maven
        run: mvn
          --batch-mode
          --update-snapshots
          --file pom.xml
          -Drevision=0.0.1-SNAPSHOT
          test
          --activate-profiles test,coverage,${{ matrix.maven-profile-spring-cloud }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: microsphere-projects/microsphere-observability

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f "docker/test-services.yml" down